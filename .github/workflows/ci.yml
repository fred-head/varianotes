name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: 1.26.9
  NODE_VERSION: "24"
  RELEASE_VERSION: 0.1.0-alpha.2.security.4

jobs:
  backend:
    name: Backend and Go security
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Unit and integration tests
        run: go test ./...

      - name: Milestone 19 adversarial authentication gate
        run: go test -count=1 ./internal/auth ./internal/app ./cmd/varianotes

      - name: Static analysis
        run: go vet ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Go security static analysis
        run: gosec -quiet ./...

      - name: Race detector
        run: go test -race ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Go vulnerability scan
        run: govulncheck ./...

  frontend:
    name: Frontend and npm security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reproducible dependency install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Production PWA build
        run: npm run build

      - name: npm vulnerability audit
        run: npm audit

  secrets:
    name: Repository secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history and working tree
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  container:
    # Keep this check name stable: the protected main branch requires it.
    name: Hardened container release gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build clean production image
        run: >-
          docker build
          --build-arg VERSION=${RELEASE_VERSION}
          --build-arg VCS_REF=${GITHUB_SHA}
          --tag varianotes:ci
          .

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: varianotes:ci
          format: table
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Smoke-test security and persistence
        run: ./scripts/ci-container-check.sh varianotes:ci "${RELEASE_VERSION}"
